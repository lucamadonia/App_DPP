name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc -b && vite build` — a type error here blocks
      # `cap sync`, so it has to fail in the PR, not at release time.
      - name: Build
        run: npm run build

      # Informational, deliberately NOT blocking.
      #
      # `eslint .` reports 463 problems (436 errors) on an untouched checkout of
      # this branch's base commit — measured in an isolated worktree, not
      # assumed: src/ 230, supabase/ 213, scripts/ 3. The supabase ones are Deno
      # edge functions linted with the browser/node config, so most of those are
      # a config artefact rather than real defects.
      #
      # Gating on that would mean a permanently red pipeline, which just teaches
      # people to ignore it. Burn the baseline down — starting by excluding
      # supabase/functions from the eslint config — then make this blocking.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test:run

      # Guards the invariants the native build depends on:
      # no window.location.origin outside the platform layer, no 100vh,
      # no raw env(safe-area-*) outside index.css.
      - name: Native invariants
        run: npm run check:native
