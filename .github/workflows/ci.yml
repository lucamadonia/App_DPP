name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the repo. It never deploys: edge functions and migrations go out
# by hand (scripts/deploy-edge-function.mjs, scripts/db-migrate.mjs) after review.
permissions:
  contents: read

jobs:
  # The repo is public, so a committed key is a published key. gitleaks scans
  # the commits this push or PR adds (not the whole history: old leaks are
  # handled by rotation, not by a CI failure nobody can fix). Runs the pinned
  # binary directly, so no third-party action or licence key is involved.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan new commits for secrets
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$GITHUB_SHA"
          else
            RANGE="-1 $GITHUB_SHA"
          fi
          echo "Scanning $RANGE"
          gitleaks git --log-opts="$RANGE" --redact --no-banner --exit-code 1 .

  verify:
    runs-on: ubuntu-latest

    # Vite inlines these at build time. Without them `createClient('', '')`
    # throws "supabaseUrl is required" while the module is still loading, so the
    # app never boots and every smoke test fails on a blank page rather than on
    # anything to do with layout.
    #
    # Placeholders are enough here: these tests assert layout, not data. If the
    # repo secrets are set they win — and the anon key is public by design (it
    # ships in the client bundle, guarded by RLS), so using the real one leaks
    # nothing.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      # Compiles the native first-run routes (intro journey, guest mode) into the
      # CI build ONLY, so the mobile smoke tests can measure eight screens that
      # are otherwise unreachable from a browser. Never set by Vercel and never
      # by build:native, so both shipping bundles fold the flag to false and drop
      # the routes entirely. See showsFirstRun() in src/lib/platform.ts.
      VITE_E2E_FIRST_RUN: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The bundle scan below only sees values CI has, so a secret that lives
      # only in the Vercel env (or an opaque one like a hex HMAC key) would slip
      # past it. This gate works on the source: every import.meta.env.VITE_*
      # name must be on the public allowlist, no dynamic env access, and no
      # vite.config define/envPrefix that pulls server env into the client.
      - name: Client env allowlist
        run: node scripts/check-vite-env-allowlist.mjs

      # `npm run build` is `tsc -b && vite build` — a type error here blocks
      # `cap sync`, so it has to fail in the PR, not at release time.
      - name: Build
        run: npm run build

      # Vite inlines every VITE_* variable it is given. Fails if a server secret
      # (Stripe sk_/rk_/whsec_, OpenRouter sk-or-, Supabase sbp_/sb_secret_,
      # a service_role JWT, a private key) ended up in the shipped bundle.
      - name: Client bundle contains no secrets
        run: node scripts/check-bundle-secrets.mjs dist

      # Every supabase/functions/<slug>/ needs an explicit verify_jwt entry in
      # supabase/config.toml, the manifest deploy-edge-function.mjs deploys from.
      - name: Edge function verify_jwt manifest
        run: node scripts/check-edge-jwt-drift.mjs

      - name: CI script tests
        run: node --test scripts/secrets-ci-checks.test.mjs

      # Blocking, with a ratchet.
      #
      # Every rule that reports a real defect is an error and the build fails on
      # it. What remains are 386 warnings of two kinds, both genuine debt rather
      # than breakage: missing type annotations (@typescript-eslint/no-explicit-any,
      # largely on third-party Shopify and DHL payloads) and React Compiler
      # diagnostics such as setState-inside-an-effect. Each of those needs a
      # per-call-site judgement that changes runtime behaviour, so they are paid
      # down deliberately, not swept through in bulk on a live app.
      #
      # --max-warnings pins the count. Adding one more is a build failure, so the
      # number can only go down. Lower it whenever you fix a batch.
      - name: Lint
        run: npx eslint . --max-warnings 385

      - name: Unit tests
        run: npm run test:run

      - name: Database regressions
        run: npm run test:database

      # Guards the invariants the native build depends on:
      # no window.location.origin outside the platform layer, no 100vh,
      # no raw env(safe-area-*) outside index.css.
      - name: Native invariants
        run: npm run check:native

      - name: Release invariants
        run: npm run check:release

      # WebKit specifically, not Chromium: the iOS app runs in a WKWebView, so
      # this is the engine that actually ships. Asserts that no public route
      # scrolls horizontally at 375px and that tap targets clear 44px — the one
      # thing about mobile layout that is objectively checkable without a human
      # looking at a screenshot.
      - name: Install WebKit for Playwright
        run: npx playwright install --with-deps webkit

      - name: Mobile smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
