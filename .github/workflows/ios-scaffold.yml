name: Scaffold iOS project

# Generates ios/ on a macOS runner and opens a PR with the result.
#
# `npx cap add ios` only runs on macOS - it needs CocoaPods and the Xcode
# toolchain - and this project is developed on Windows. Rather than making a
# Mac a prerequisite for touching the iOS build, generate the platform here
# once and commit it. From then on it is version-controlled like any other
# source: entitlements, Info.plist keys and signing settings survive, and a
# diff shows what changed.
#
# Deliberately manual (workflow_dispatch). Regenerating the platform is a
# deliberate act, not something that should ride along with an unrelated push.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Delete an existing ios/ and regenerate it from scratch'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Remove existing platform
        if: inputs.force
        run: rm -rf ios

      # `cap add ios` copies webDir into the project, so dist/ has to exist.
      # build:native (not build) sets CAPACITOR_BUILD=1, which keeps the PWA
      # service worker out of the bundle - a precached shell inside a WebView
      # would survive app updates and strand users on stale assets.
      - name: Build web assets
        run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync
        run: npx cap sync ios

      # Associated Domains entitlement, permission strings, signing team and
      # ExportOptions.plist. Fails loudly if the project layout changed, rather
      # than producing a build whose Universal Links silently do not work.
      - name: Configure project
        run: node scripts/configure-ios.mjs

      # Proof it compiles before anyone is asked to review it. No signing:
      # CODE_SIGNING_ALLOWED=NO builds the code without certificates, which is
      # what we can verify here.
      - name: Verify it builds
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build | tail -30

      # Pushes a branch; the pull request is opened by hand from it.
      #
      # Creating a PR from inside Actions additionally needs the repo-level
      # "Allow GitHub Actions to create and approve pull requests" toggle, which
      # this repo does not grant — and it is a permission worth not depending
      # on. Pushing a branch only needs `contents: write`, which the job has.
      - name: Push the generated platform
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b chore/ios-platform

          # .gitignore already excludes Pods/ and the copied web assets, so this
          # picks up the Xcode project itself and nothing that gets regenerated.
          git add ios
          if git diff --cached --quiet; then
            echo '::notice::ios/ is unchanged — nothing to push.'
            exit 0
          fi

          git commit -m 'chore(ios): iOS-Plattform erzeugen und konfigurieren'             -m 'Erzeugt auf einem macOS-Runner via `npx cap add ios`, weil das Projekt unter Windows entwickelt wird und `cap add ios` CocoaPods und die Xcode-Toolchain braucht.'             -m 'configure-ios.mjs setzt anschliessend, was `cap add ios` nicht wissen kann: das Associated-Domains-Entitlement fuer Universal Links, die Berechtigungstexte, das Signing-Team und die ExportOptions.plist, die mobile-release.yml erwartet.'

          # A lease needs something to compare against. On the first run the
          # branch does not exist on the remote at all, and --force-with-lease
          # then refuses with "stale info" rather than doing the obvious thing —
          # so the two cases are told apart explicitly. A re-run still replaces
          # only what it can see, and never clobbers unseen work.
          if git ls-remote --exit-code --heads origin chore/ios-platform >/dev/null 2>&1; then
            git fetch origin chore/ios-platform
            git push --force-with-lease origin chore/ios-platform
          else
            git push origin chore/ios-platform
          fi
          echo "::notice::Pushed chore/ios-platform — open a PR from it."
