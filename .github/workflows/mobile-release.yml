name: Mobile Release

# Builds signed store artifacts on a version tag.
#
# Android works once the keystore secrets exist — the native project is
# committed, so the runner has everything it needs.
#
# iOS requires `npx cap add ios` to have been run ON A MAC and committed first;
# the platform cannot be generated on Windows or Linux. Until then the ios job
# warns and skips rather than failing the whole run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # `build` is `tsc -b && vite build` — a type error must stop the release,
      # not produce a broken bundle.
      - name: Build web assets
        run: npm run build

      - name: Guard native invariants
        run: npm run check:native

      - name: Sync Capacitor
        run: npx cap sync android

      # versionCode has to increase monotonically for every Play upload.
      # The run number gives that for free; versionName comes from package.json.
      - name: Stamp version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Requires a Play service account with the "Release manager" role.
      - name: Upload to Play internal testing
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.trackbliss.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the iOS platform exists
        id: guard
        run: |
          if [ ! -d "ios/App" ]; then
            echo "::warning::ios/ is missing. Run 'npx cap add ios' on a Mac and commit it before releasing to the App Store."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.present == 'true'

      - run: npm run build
        if: steps.guard.outputs.present == 'true'

      - run: npx cap sync ios
        if: steps.guard.outputs.present == 'true'

      - name: Install signing assets
        if: steps.guard.outputs.present == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          rm -f cert.p12

      - name: Archive and export
        if: steps.guard.outputs.present == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Upload to TestFlight
        if: steps.guard.outputs.present == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -f ios/App/build/ipa/App.ipa -t ios \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"
