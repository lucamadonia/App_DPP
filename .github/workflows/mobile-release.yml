name: Mobile Release

# Builds signed store artifacts on a version tag.
#
# Both native projects are committed. Tagged runs are release contracts: they
# must have complete Android, Play, iOS and App Store credentials, otherwise the
# affected job fails instead of reporting a misleading successful release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Store target for this run
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify release metadata and native invariants
        run: |
          npm run check:release
          npm run check:native

      - name: Unit tests
        run: npm run test:run

      - name: Match tag to package version
        if: github.ref_type == 'tag'
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${VERSION_NAME}."
            exit 1
          fi

  android:
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Cheapest gate first: a text scan over src/ costs seconds, a build costs
      # minutes. Fail before spending them.
      - name: Guard native invariants
        run: npm run check:native

      # MUST be build:native, not build. `build:native` sets CAPACITOR_BUILD=1,
      # which is what makes vite.config.ts leave VitePWA out. With a plain
      # `npm run build` the service worker is emitted and — because
      # capacitor.config.ts uses androidScheme 'https', making https://localhost
      # a secure origin — it actually registers inside the WebView. A precached
      # shell then survives an app update and strands users on stale assets,
      # which is the exact failure build-native.mjs exists to prevent.
      # `build:native` still runs `tsc -b && vite build` underneath, so a type
      # error stops the release just as before.
      - name: Build web assets
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      # versionCode has to increase monotonically for every Play upload.
      # The run number gives that for free; versionName comes from package.json.
      - name: Stamp version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Requires a Play service account with the "Release manager" role.
      #
      # The `secrets` context is NOT available in a step-level `if` — using it
      # there makes GitHub reject the entire workflow at validation time (the
      # run reports "failure" with zero jobs, which looks nothing like a syntax
      # error). Hence the env indirection.
      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is required for a tagged Android release."
            exit 1
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Play internal testing
        if: steps.play.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.trackbliss.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    needs: preflight
    runs-on: macos-26
    environment: app-store
    steps:
      - uses: actions/checkout@v4

      - name: Require the current App Store toolchain
        run: |
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::App Store uploads require Xcode 26+ with the iOS 26+ SDK."
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            exit 1
          fi
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Check the iOS platform exists
        id: guard
        run: |
          if [ ! -d "ios/App" ]; then
            echo "::warning::ios/ is missing. Run 'npx cap add ios' on a Mac and commit it before releasing to the App Store."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.present == 'true'

      # Same reason as the Android job above: build:native sets CAPACITOR_BUILD=1
      # so no service worker is emitted into the bundle. iOS happens to be safer
      # here (capacitor://localhost is not a secure origin, so a SW would not
      # register), but shipping dead sw.js/registerSW.js into the IPA is still
      # pointless weight.
      - run: npm run build:native
        if: steps.guard.outputs.present == 'true'

      - run: npx cap sync ios
        if: steps.guard.outputs.present == 'true'

      # App Store Connect rejects any upload whose build number it has seen
      # before, so CURRENT_PROJECT_VERSION has to increase on every run — the
      # scaffold leaves it pinned at 1 forever. Same source of truth as Android:
      # the run number for the build, package.json for the marketing version.
      - name: Stamp version
        if: steps.guard.outputs.present == 'true'
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          BUILD_NUMBER=${{ github.run_number }}
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" App/Info.plist 2>/dev/null || true
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION_NAME;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
          echo "Building $VERSION_NAME ($BUILD_NUMBER)"

      # Same pattern as the Play upload below: the `secrets` context is not
      # available in a step-level `if`, so presence has to be turned into an
      # output first. Without this the job FAILS when no certificate is set up
      # yet - which is not a broken pipeline, just an incomplete Apple account.
      - name: Check for signing credentials
        id: signing
        if: steps.guard.outputs.present == 'true'
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APPLE_SIGN_IN_READY: ${{ vars.APPLE_SIGN_IN_CONFIGURED }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APP_STORE_APP_ID" ] && [ "$APPLE_SIGN_IN_READY" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS release setup is incomplete - building unsigned and skipping TestFlight."
            echo "::notice::Required: signing certificate/profile, Apple ID/app password, APP_STORE_CONNECT_APP_ID and APPLE_SIGN_IN_CONFIGURED=true."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Proves the project still compiles even when there is nothing to sign
      # with, so a signing gap never hides a real build regression.
      - name: Verify it builds (unsigned)
        if: steps.guard.outputs.present == 'true' && steps.signing.outputs.available != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Require iOS release credentials for tagged release
        if: steps.guard.outputs.present == 'true' && steps.signing.outputs.available != 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        run: |
          echo "::error::An iOS store run requires complete signing/upload credentials, an App Store Connect app record and configured Sign in with Apple."
          exit 1

      - name: Install signing assets
        id: signing-assets
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          SOURCE_PROFILE="$RUNNER_TEMP/app.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$SOURCE_PROFILE"
          security cms -D -i "$SOURCE_PROFILE" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_EXPIRATION=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST")

          if [ "$PROFILE_APP_ID" != "WU8U8HD73G.eu.trackbliss.app" ]; then
            echo "::error::Provisioning profile belongs to $PROFILE_APP_ID, expected WU8U8HD73G.eu.trackbliss.app."
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$PROFILE_PLIST" | grep -qx 'Default'; then
            echo "::error::Provisioning profile does not include Sign in with Apple. Regenerate it after enabling the capability."
            exit 1
          fi

          INSTALLED_PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SOURCE_PROFILE" "$INSTALLED_PROFILE"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_path=$INSTALLED_PROFILE" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "Provisioning profile: $PROFILE_NAME (expires $PROFILE_EXPIRATION)"

      - name: Archive and export
        if: steps.signing.outputs.available == 'true'
        working-directory: ios/App
        run: |
          mkdir -p build
          cp ExportOptions.plist build/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' build/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' build/ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:eu.trackbliss.app string ${{ steps.signing-assets.outputs.profile_name }}" build/ExportOptions.ci.plist

          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=WU8U8HD73G CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='${{ steps.signing-assets.outputs.profile_name }}' \
            clean archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.ci.plist -exportPath build/ipa

      - name: Remove iOS signing assets
        if: always() && steps.signing.outputs.available == 'true'
        env:
          KEYCHAIN_PATH: ${{ steps.signing-assets.outputs.keychain_path }}
          PROFILE_PATH: ${{ steps.signing-assets.outputs.profile_path }}
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "$PROFILE_PATH" ]; then rm -f "$PROFILE_PATH"; fi
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

      - name: Locate exported IPA
        id: ipa
        if: steps.signing.outputs.available == 'true'
        run: |
          IPA_PATH=$(find ios/App/build/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Xcode export completed without an IPA."
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30

      - name: Validate App Store package
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"

      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"
